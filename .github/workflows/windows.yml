name: Windows Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-voicestudio.txt
      - name: Install Test Dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r requirements-voicestudio.txt ruff
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Lint
        run: python -m ruff check aibook tests scripts main.py voice_studio_main.py download_voicestudio_models.py
      - name: Tests
        run: python -m unittest discover -s tests -v
